<style>
/* 레이아웃: 밝은 화면 고정. 연한 바탕 위 흰 카드, 질문형 타일(파스텔), 위 바·아래 탭, 최대 600px 기둥. */
:root {

  --b: #f0507a;            /* 사람 B */

  --bar: rgba(255, 255, 255, .9);

  --c-love: #e8456b; --p-love: #ffe9ef;
  --c-routine: #5b57d6; --p-routine: #efeeff;
  --c-balance: #1f9c93; --p-balance: #e4f6f4;
  --c-life: #2e9e4f; --p-life: #e9f7ec;
  --c-mbti: #9150e0; --p-mbti: #f4ebff;
  --c-us: #e8456b; --p-us: #fdecef;
  --c-lang: #d0561b; --p-lang: #fff0e6;
  --c-sig: var(--c-us); --p-sig: var(--p-us); --c-first: var(--c-freq); --p-first: var(--p-freq);
  --c-reply: var(--c-speed); --p-reply: var(--p-speed); --c-curious: var(--c-mbti); --p-curious: var(--p-mbti);
  --c-heart: var(--c-love); --p-heart: var(--p-love); --c-trend: var(--c-balance); --p-trend: var(--p-balance);
  --c-fbond: var(--c-freq); --p-fbond: var(--p-freq); --c-flaugh: var(--c-speed); --p-flaugh: var(--p-speed);
  --c-ftalk: var(--c-balance); --p-ftalk: var(--p-balance); --c-freply: var(--c-mbti); --p-freply: var(--p-mbti);
  --c-fcare: var(--c-love); --p-fcare: var(--p-love); --c-ftopic: var(--c-life); --p-ftopic: var(--p-life);
  --c-gbond: var(--c-freq); --p-gbond: var(--p-freq); --c-gshare: var(--c-balance); --p-gshare: var(--p-balance);
  --c-glaugh: var(--c-speed); --p-glaugh: var(--p-speed); --c-gfirst: var(--c-mbti); --p-gfirst: var(--p-mbti);
  --c-gpair: var(--c-love); --p-gpair: var(--p-love); --c-gcare: var(--c-life); --p-gcare: var(--p-life);
  --c-conflict: #e0483e; --p-conflict: #ffeceb;

}

.appicon { width: 84px; height: 84px; border-radius: 20px; justify-self: center; display: grid; place-items: center; background: linear-gradient(160deg, #ff5e7e, #ff2d55); box-shadow: 0 8px 24px rgba(255, 45, 85, .25); color: #fff; }

/* 로딩 */
.loading { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font-size: 15px; }

/* ----- 상세 화면 ----- */
.panel { display: grid; gap: 24px; }
.read { display: grid; gap: 12px; }

.season h4 { font-size: 17px; }
.season .st { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.season .w { display: flex; flex-wrap: wrap; gap: 4px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.duo > div { background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; font-size: 15px; }
.nicks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.nick { background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 1px; }
.nick b { font-size: 22px; letter-spacing: -0.02em; }
.nick span { font-size: 13px; color: var(--muted); }
/* 조언 */
.lights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.light { background: var(--surface); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 0; font-size: 15px; }
.light .sig { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.light .sig::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.light.green .sig::before { background: var(--good); } .light.yellow .sig::before { background: var(--warn); } .light.red .sig::before { background: var(--bad); }
.light .num { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.items { display: grid; gap: 12px; }
.item { background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.item h4 { font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .k { font-size: 13px; color: var(--muted); }
.item p { font-size: 15px; line-height: 1.5; }
.pill { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 7px; }
.pill.high { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
.pill.mid { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.pill.low, .pill.gen { color: var(--muted); background: var(--fill); }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
/* MBTI */
.mbti { display: grid; gap: 12px; }
.mbti .card { display: grid; gap: 10px; }
.mbti .type { font-size: 34px; font-weight: 700; letter-spacing: .04em; }
.axis { display: grid; gap: 3px; font-size: 13px; }
.axis .bar { display: grid; grid-template-columns: 18px 1fr 18px; align-items: center; gap: 8px; font-weight: 600; }
.axis .track { position: relative; height: 6px; background: var(--track); border-radius: 99px; }
.axis .track i { position: absolute; top: 0; height: 100%; border-radius: 99px; }
.axis .why { color: var(--muted); font-size: 13px; }

/* v4: 질문형 타일과 답 카드 */
.hello-name { font-size: 15px; color: var(--muted); }
.hello-name b { color: var(--fg); }
.qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.qtile { display: grid; gap: 10px; align-content: space-between; padding: 16px; border-radius: var(--r); text-decoration: none; min-height: 150px; min-width: 0; transition: transform .12s; }
.qtile:active { transform: scale(.98); }
.qtile .q { font-size: 15px; font-weight: 600; line-height: 1.35; }
.qtile .ans { display: grid; gap: 2px; }
.qtile .ans b { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; color: var(--fg); }
.qtile .ans span { font-size: 13px; color: var(--muted); line-height: 1.35; }
.qtile .badge { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.7); display: grid; place-items: center; }
.qtile .badge .ico { width: 20px; height: 20px; stroke-width: 2; }
.score-card { display: grid; gap: 14px; padding: 18px; }
.score-line { display: flex; align-items: center; gap: 16px; }
.score-line .ring { width: 72px; height: 72px; flex: none; }
.score-line .ring text { display: none; }
.score-big { font-size: 15px; color: var(--muted); }
.score-big b { font-size: 28px; color: var(--fg); letter-spacing: -0.02em; }
.score-verdict { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.banner { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: var(--r); text-decoration: none; color: #fff; background: var(--tint); }
.banner .ico { width: 30px; height: 30px; flex: none; }
.banner b { display: block; font-size: 17px; }
.banner span { font-size: 14px; opacity: .9; }
.banner .chev { margin-left: auto; width: 20px; height: 20px; opacity: .9; }
.answer { padding: 18px; border-radius: var(--r); display: grid; gap: 4px; }
.answer .q { font-size: 15px; font-weight: 600; }
.answer b { font-size: 28px; letter-spacing: -0.02em; color: var(--fg); line-height: 1.2; }
.answer span { font-size: 15px; color: var(--muted); }
.qrow .badge { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.qrow .badge .ico { width: 22px; height: 22px; stroke-width: 2; }

/* v5: 브랜드·관계 고르기·보안 */
.brand-name { font-size: clamp(44px, 13vw, 60px); font-weight: 800; letter-spacing: -0.02em; text-align: center; line-height: 1.05; color: var(--tint); }
.brand-tag { text-align: center; color: var(--muted); font-size: 17px; margin-top: 10px; }
.pick-q { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; text-align: center; }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pick { display: grid; gap: 8px; justify-items: start; padding: 18px 16px; border-radius: var(--r); border: 0; text-align: left; cursor: pointer; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; }
.pick:active { transform: scale(.98); }
.pick .badge { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.pick .badge .ico { width: 22px; height: 22px; stroke-width: 2; }
.pick b { font-size: 24px; letter-spacing: -0.02em; line-height: 1.2; }
.pick span { font-size: 15px; color: var(--muted); line-height: 1.4; }
.pick .soon { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--fill); border-radius: 6px; padding: 2px 6px; }
.secure { display: grid; gap: 14px; padding: 18px; }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sitem { display: flex; align-items: center; gap: 8px; padding: 12px 10px; white-space: nowrap; border-radius: 12px; background: var(--fill); }
.sitem .ico { width: 20px; height: 20px; color: var(--good); stroke-width: 2.2; flex: none; }
.sitem b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.secure h3 { font-size: 19px; display: flex; align-items: center; gap: 8px; }
.secure h3 .ico { color: var(--good); width: 22px; height: 22px; stroke-width: 2.2; }
.secure ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.secure li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 15px; line-height: 1.45; }
.secure li .ico { width: 20px; height: 20px; color: var(--good); stroke-width: 2.4; margin-top: 1px; }
.secure li b { display: block; font-weight: 600; }
.secure li span { color: var(--muted); font-size: 14px; }
.lockline { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--muted); }
.lockline .ico { width: 15px; height: 15px; color: var(--good); stroke-width: 2.4; }
.soon-box { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 28px 20px; }
.chip-back { border: 0; background: var(--fill); color: var(--fg); border-radius: 99px; padding: 6px 12px; font-size: 14px; cursor: pointer; justify-self: center; }

/* v6: 사랑 이야기 오프닝 */
.opening { min-height: 62vh; display: grid; align-content: center; gap: 14px; padding: 40px 8px; text-align: center; }
.opening p { font-size: 20px; line-height: 1.5; font-weight: 600; letter-spacing: -0.02em; color: var(--fg); opacity: 0; animation: fadeup 1s ease forwards; }
.opening p:nth-child(3) { font-size: 24px; color: var(--accent); }
.opening p:nth-last-child(-n+3):not(.start) { color: var(--muted); font-weight: 500; }
.opening p.start { margin-top: 26px; font-size: 22px; font-weight: 700; color: var(--accent); }
.opening p.start::before { content: ""; display: block; width: 28px; height: 2px; margin: 0 auto 22px; background: var(--accent); opacity: .5; border-radius: 2px; }
@keyframes fadeup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .opening p { animation: none; opacity: 1; } }
.lines { display: grid; gap: 6px; text-align: center; padding: 12px 0; }
.lines p { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.5; }
.lines p:last-child { color: var(--muted); font-weight: 500; font-size: 17px; }
.letter { white-space: pre-line; line-height: 1.85 !important; }
.cover .eyebrow { color: var(--tint); letter-spacing: .08em; }

/* v9: 발견 카드 + 자세히 보기 */
.insights { display: grid; gap: 12px; }
.insight { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.insight .it { font-size: 13px; font-weight: 700; letter-spacing: 0; }
.insight .is { font-size: 17px; font-weight: 600; line-height: 1.45; letter-spacing: -0.02em; }
.versus { display: grid; gap: 8px; }
.vrow { display: grid; grid-template-columns: minmax(44px, auto) 1fr auto; align-items: center; gap: 10px; font-size: 15px; }
.vrow .vn { font-weight: 600; white-space: nowrap; }
.vrow .vn.pa { color: var(--a); } .vrow .vn.pb { color: var(--b); }
.vbar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
.vbar i { display: block; height: 100%; border-radius: 99px; opacity: .45; }
.vbar i.pa { background: var(--a); } .vbar i.pb { background: var(--b); }
.vrow.win .vbar i { opacity: 1; }
.vrow .vv { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 52px; text-align: right; }
.vrow.win .vv { color: var(--fg); font-weight: 700; }
.bignum { display: grid; gap: 2px; }
.bignum b { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.bignum span { font-size: 14px; color: var(--muted); }
details.more { background: var(--surface); border-radius: var(--r); padding: 0 16px; }
details.more > summary { list-style: none; cursor: pointer; padding: 16px 0; font-size: 16px; font-weight: 600; color: var(--tint); display: flex; justify-content: space-between; align-items: center; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "펼치기"; font-size: 13px; color: var(--muted); font-weight: 500; }
details.more[open] > summary::after { content: "접기"; }
details.more[open] { padding-bottom: 16px; background: transparent; padding-left: 0; padding-right: 0; }
details.more[open] > summary { background: var(--surface); border-radius: var(--r); padding: 16px; }

/* v20: 연구 기반 조언 */
.item.adv.done { box-shadow: 0 0 0 2px color-mix(in srgb, var(--good) 45%, transparent) inset; }
.trybox { display: grid; gap: 6px; border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px 12px; }
.trybox .k .cap { font-size: 12px; }
.tryq { font-size: 15px; line-height: 1.5; color: var(--fg); }
.exbox { display: grid; gap: 8px; }
.exbox .scene { background: var(--fill); }
.exnote { font-size: 13px; color: var(--muted); text-align: center; margin-top: -2px; }
.copybtn { justify-self: start; display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 13px; font-weight: 600; color: var(--tint); background: var(--fill); border: 0; border-radius: 99px; padding: 5px 11px; cursor: pointer; }
.copybtn svg { width: 14px; height: 14px; }
details.sci { background: var(--fill); border-radius: 12px; padding: 8px 12px; }
details.sci summary { font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; list-style: none; }
details.sci summary::before { content: "📖 "; }
details.sci p { font-size: 14px; color: var(--fg); margin-top: 6px; line-height: 1.55; }
.mission { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; padding-top: 2px; }
.mission input { width: 20px; height: 20px; accent-color: var(--good); }
.item.done .mission { color: var(--good); font-weight: 600; }
.qitem p { font-size: 16px; font-weight: 600; }
.item.fight { gap: 8px; }
.fx { border-radius: 12px; padding: 9px 12px; display: grid; gap: 3px; }
.fx .tag { font-size: 12px; font-weight: 700; }
.fx p { font-size: 15px; }
.fx.bad { background: color-mix(in srgb, var(--bad) 8%, transparent); } .fx.bad .tag { color: var(--bad); } .fx.bad p { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.fx.good { background: color-mix(in srgb, var(--good) 10%, transparent); } .fx.good .tag { color: var(--good); }
#toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: rgba(20,20,24,.92); color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 99px; opacity: 0; transition: .25s; z-index: 70; pointer-events: none; white-space: nowrap; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
/* v19: 단톡방 */
.gchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.gchips span { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--surface); color: var(--gc, var(--muted)); box-shadow: 0 0 0 1px var(--line) inset; }
.ranks { display: grid; gap: 7px; }
.rrow { display: grid; grid-template-columns: minmax(56px, 34%) 1fr auto; gap: 10px; align-items: center; font-size: 15px; }
.rrow .rn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .vbar i { opacity: .55; } .rrow.top .vbar i { opacity: 1; }
.rrow .vv { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; } .rrow.top .vv { color: var(--fg); font-weight: 700; }
.gscene .bub.g { justify-self: start; background: var(--gc); color: #fff; }
.gscene .bub.g small { color: rgba(255,255,255,.85); }
.info select#gme { font: inherit; font-size: 17px; }
/* v18.1: 친구 모드는 파란색 */
:root[data-mode="friend"] { --tint: #2f6fe0; --accent: #2f6fe0; --c-us: #2f6fe0; --p-us: #eaf2ff; }
.pick[data-rel="friend"] { box-shadow: 0 0 0 1.5px #9dbcf5 inset; }
:root[data-mode="friend"] .pick[data-rel="friend"] { box-shadow: 0 0 0 2px #2f6fe0 inset; }
/* v13: 안전 */
.trust { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: start; text-align: left; text-decoration: none; color: var(--fg); background: #eaf7ee; border: 1.5px solid #bfe6cb; border-radius: var(--r); padding: 16px; }
.trust-ico { width: 52px; height: 52px; border-radius: 16px; background: var(--good); color: #fff; display: grid; place-items: center; }
.trust-ico .ico { width: 30px; height: 30px; stroke-width: 2; }
.trust-body { display: grid; gap: 4px; }
.trust-body > b { font-size: 19px; letter-spacing: -0.02em; color: #1d6b35; }
.trust-body > span { font-size: 15px; line-height: 1.45; color: #2f5a3d; }
.trust-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.trust-chips i { font-style: normal; font-size: 13px; font-weight: 600; color: #1d6b35; background: #fff; border-radius: 99px; padding: 3px 10px; }
.trust-body .trust-more { font-size: 14px; font-weight: 700; color: var(--good); margin-top: 2px; }
.trust.compact { grid-template-columns: 40px 1fr; padding: 12px 14px; }
.trust.compact .trust-ico { width: 40px; height: 40px; border-radius: 12px; } .trust.compact .trust-ico .ico { width: 22px; height: 22px; }
.trust.compact .trust-body > b { font-size: 16px; } .trust.compact .trust-body > span { font-size: 14px; }
.flow { display: grid; gap: 6px; justify-items: center; background: var(--surface); border-radius: var(--r); padding: 18px 16px; }
.fbox { width: 100%; text-align: center; padding: 12px; border-radius: 12px; background: var(--fill); font-weight: 600; font-size: 15px; }
.fbox.on { background: #eaf7ee; color: #1d6b35; border: 1.5px solid #bfe6cb; display: grid; gap: 2px; justify-items: center; }
.fbox.on .ico { width: 20px; height: 20px; color: var(--good); }
.fbox small { font-weight: 500; font-size: 13px; color: #2f5a3d; }
.farrow { color: var(--muted); font-size: 18px; line-height: 1; }
.fno { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.fno s { font-size: 14px; color: var(--bad); background: #fdecea; border-radius: 99px; padding: 3px 10px; text-decoration-thickness: 2px; }
.fno span { width: 100%; text-align: center; font-size: 13px; color: var(--muted); }
.sl { display: grid; gap: 16px; }
.srow { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
.srow .sb { width: 36px; height: 36px; border-radius: 11px; background: #eaf7ee; color: var(--good); display: grid; place-items: center; }
.srow .sb .ico { width: 20px; height: 20px; stroke-width: 2.1; }
.srow > div { display: grid; gap: 3px; }
.srow b { font-size: 16px; } .srow p { font-size: 15px; line-height: 1.5; color: var(--muted); }
.nt { display: flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 600; margin-top: 8px; color: var(--muted) !important; }
.nt.ok { color: var(--good) !important; } .nt.warn { color: var(--warn) !important; }
.nt .ico { width: 18px; height: 18px; stroke-width: 2.4; }
/* 웹앱 설치 안내 */
.install { padding: 16px; display: grid; gap: 8px; border: 1.5px solid var(--p-us); }
.install-h { display: flex; justify-content: space-between; align-items: center; }
.install-h b { font-size: 17px; color: var(--tint); }
.install .x { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px; }
.install ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
.install ol .ico { width: 18px; height: 18px; vertical-align: -3px; margin: 0 2px; color: var(--a); }
.install small { color: var(--muted); font-size: 13px; }
/* v11: 사랑의 언어 */
.langs { display: grid; gap: 7px; }
.lrow { display: grid; grid-template-columns: 96px 1fr 40px; gap: 10px; align-items: center; font-size: 15px; }
.lrow .vbar i { background: var(--c-lang); opacity: .35; }
.lrow.top .vbar i { opacity: 1; }
.lrow.top .ln, .lrow.top .vv { font-weight: 700; color: var(--c-lang); }
.lrow .vv { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.lq { display: flex; flex-wrap: wrap; gap: 6px; }
.lq q { font-size: 14px; background: var(--p-lang); color: var(--fg); border-radius: 14px 14px 14px 4px; padding: 6px 11px; }
.lq q::before, .lq q::after { content: ""; }
/* v10: 우리 정보 입력 */
.info .ym { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }
.reasons { display: grid; gap: 10px; }
.rsn { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.rsn > b { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--p-mbti); color: var(--c-mbti); font-weight: 800; font-size: 17px; }
.rsn p { font-size: 15px; line-height: 1.5; }
.rsn small { display: block; margin-top: 4px; font-size: 13px; line-height: 1.45; color: var(--tint); }
.rsn.off > b { background: var(--p-us); color: var(--tint); }

.info { display: grid; gap: 14px; }
.info .field { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.info .field > b { font-size: 17px; }
.info .field > small { color: var(--muted); font-size: 14px; line-height: 1.45; }
.info input[type=date], .info input[type=text], .info select { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-height: 48px; -webkit-appearance: none; appearance: none; }
.info .mrow { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 12px; }
.info .mrow .nm { font-weight: 700; font-size: 17px; }
.info .mrow .nm small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.info .me { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.info .me button { font: inherit; font-size: 17px; font-weight: 600; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.info .me button[aria-pressed="true"] { background: var(--p-us); border-color: var(--tint); color: var(--tint); }
.info .note { font-size: 13px; color: var(--muted); text-align: center; }
.mtag { font-size: 12px; font-weight: 700; color: var(--tint); background: var(--p-us); border-radius: 99px; padding: 1px 7px; margin-left: 4px; vertical-align: 2px; }
